<title>CAS Zork Expedition</title>
<!-- System font fallbacks keep the downloadable map fully offline. -->
<style>
/* Layout concept: a survey chart with a literal ground line. The surface sits on top, the
   underground hangs below it, and the lantern's amber is the only warm colour on the sheet. */
:root {
  --bg: #ECEFE8; --panel: #F7F8F4; --panel-2: #E3E8DF; --ink: #141F1C; --muted: #56655F;
  --line: #C5CFC6; --grid: #C9D2C8; --lamp: #DB8A00; --lamp-soft: #FBE8BD; --lamp-ink: #3F2700;
  --z-above: #3B7B51; --z-house: #A85F2A; --z-under: #4666A0; --z-maze: #7A55A6; --z-water: #1E8494;
  --danger: #C23B2B; --earth: #E1DDCF; --earth-2: #D6D0BE;
  --shadow: 0 1px 2px rgba(20,31,28,.08), 0 10px 28px rgba(20,31,28,.06);
  --f-display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --f-ascii: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1113; --panel: #131C1F; --panel-2: #1A2528; --ink: #E6EEEA; --muted: #8CA19A;
    --line: #26363A; --grid: #1B292C; --lamp: #FFB627; --lamp-soft: #3A2A08; --lamp-ink: #FFE2A6;
    --z-above: #6FBF88; --z-house: #E29A63; --z-under: #86A6E6; --z-maze: #B394E0; --z-water: #5CC6D6;
    --danger: #FF7A66; --earth: #0F181A; --earth-2: #0C1416;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1113; --panel: #131C1F; --panel-2: #1A2528; --ink: #E6EEEA; --muted: #8CA19A;
  --line: #26363A; --grid: #1B292C; --lamp: #FFB627; --lamp-soft: #3A2A08; --lamp-ink: #FFE2A6;
  --z-above: #6FBF88; --z-house: #E29A63; --z-under: #86A6E6; --z-maze: #B394E0; --z-water: #5CC6D6;
  --danger: #FF7A66; --earth: #0F181A; --earth-2: #0C1416;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header.top h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 700; line-height: 1.05; margin-top: 10px; }
header.top p { margin: 10px 0 0; max-width: 62ch; color: var(--muted); }
.stamp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 400 12px var(--f-mono); color: var(--muted); }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.pill.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); margin-right: 7px; box-shadow: 0 0 8px var(--lamp); }

.figures { display: flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.fig { flex: 1 1 140px; padding: 14px 18px; border-right: 1px solid var(--line); min-width: 0; }
.fig:last-child { border-right: 0; }
.fig b { display: block; font: 600 26px/1.1 var(--f-mono); letter-spacing: -.02em; margin-top: 6px; }
.fig b small { font-size: 13px; color: var(--muted); font-weight: 400; }
.fig span { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fig.lamp b { color: var(--lamp); }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1040px) { .layout { grid-template-columns: minmax(0, 1fr) 360px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 18px; font-weight: 650; }
.pad { padding: 16px 18px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: 500 13px var(--f-body); min-height: 34px; }
.btn:hover { border-color: var(--lamp); }
.btn.icon { padding: 6px 11px; font-family: var(--f-mono); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--f-mono); color: var(--muted); padding-inline: 6px; cursor: pointer; }
.live input { accent-color: var(--lamp); }
.viewport { position: relative; height: clamp(420px, 72vh, 820px); overflow: auto; background: var(--bg); overscroll-behavior: contain; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.viewport svg { display: block; }
.viewport svg#map { overflow: visible; }
.compass { position: absolute; right: 14px; top: 12px; width: 62px; height: 62px; pointer-events: none; opacity: .85; }
.replay { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.replay input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--lamp); }
.replay label { font: 500 12px var(--f-mono); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { flex: none; }

/* SVG map */
.dots { fill: var(--grid); }
.earth { fill: var(--earth); }
.ground { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .55; }
.band { font: 600 11px var(--f-mono); letter-spacing: .16em; fill: var(--muted); text-transform: uppercase; }
.edge { fill: none; stroke: var(--ink); stroke-opacity: .55; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.edge.door { stroke-dasharray: 7 5; }
.edge.locked { stroke: var(--danger); stroke-opacity: .8; stroke-dasharray: 3 6; }
.edge.assumed { stroke-opacity: .35; }
.dir { font: 600 10px var(--f-mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.stub { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 3 5; stroke-linecap: round; fill: none; }
.stubq { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
.stubt { font: 700 11px var(--f-mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.trail { fill: none; stroke: var(--lamp); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 11; opacity: .8; }
.node { cursor: pointer; }
.node rect.body { fill: color-mix(in srgb, var(--zc) 15%, var(--panel)); stroke: var(--zc); stroke-width: 2; }
.node.seen rect.body { fill: var(--panel); stroke-dasharray: 5 4; }
.node.sel rect.body { stroke-width: 3.5; }
.node text.nm { font: 600 13px/1 var(--f-body); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.node .halo { fill: none; stroke: var(--lamp); stroke-width: 3; opacity: 0; }
.node.sel .halo { opacity: .55; }
.node:hover rect.body { stroke-width: 3; }
.you .glow { fill: none; stroke: var(--lamp); stroke-width: 3.5; filter: drop-shadow(0 0 7px var(--lamp)); animation: pulse 2.4s ease-in-out infinite; }
.pin rect { fill: var(--lamp); }
.pin text { font: 700 10px var(--f-mono); letter-spacing: .1em; fill: var(--lamp-ink); text-anchor: middle; dominant-baseline: central; }
.pin path { fill: var(--lamp); }
.badge { stroke: var(--panel); stroke-width: 2; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .you .glow { animation: none; } }

/* Pixel world */
#worldWrap { position: relative; }
#worldWrap canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.wl-hot { position: absolute; inset: 0; pointer-events: none; }
.hot { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; pointer-events: auto; font: inherit; color: inherit; }
.hot .ring { position: absolute; inset: -3px; border: 2px solid transparent; border-radius: 6px; pointer-events: none; transition: border-color .12s, box-shadow .12s; }
.hot:hover .ring, .hot:focus-visible .ring { border-color: var(--lamp); box-shadow: 0 0 0 2px rgba(0,0,0,.45), 0 0 16px color-mix(in srgb, var(--lamp) 75%, transparent); }
.hot.sel .ring { border-color: #fff; box-shadow: 0 0 0 2px var(--lamp), 0 0 20px var(--lamp); }
.hot .lab { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; pointer-events: none;
  font: 700 calc(7px + var(--wz, 2) * 1.5px)/1 'Silkscreen', var(--f-ascii); letter-spacing: .05em; text-transform: uppercase;
  color: #f7f1de; background: rgba(9, 12, 18, .8); padding: 3px 5px 2px; border-radius: 3px; }
.hot.dim .lab { color: #9aa6b8; }
#worldWrap[data-lo="1"] .hot:not(.sel):not(.cur):not(:hover):not(:focus-visible) .lab { display: none; }
.hot.side .lab { left: 100%; top: 50%; transform: translate(7px, -50%); }
.hot.cur .lab { color: #ffb627; }
.hot.q { display: grid; place-items: center; font: 700 calc(7px + var(--wz, 2) * 2px)/1 'Silkscreen', var(--f-ascii); color: #ffe58a; background: rgba(9, 12, 18, .82); border: 1px solid #ffb627; border-radius: 50%; }
.hot.q:hover { background: #ffb627; color: #0d1117; }
.reg { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
  font: 700 calc(6px + var(--wz, 2) * 1.8px)/1 'Silkscreen', var(--f-ascii); letter-spacing: .22em; text-transform: uppercase; color: rgba(247, 241, 222, .6); text-shadow: 0 1px 0 rgba(0,0,0,.7), 0 0 6px rgba(0,0,0,.5); }
.portrait { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 10px; border: 1px solid var(--line); margin-top: 12px; background: #0d1117; }
.skc { display: grid; gap: 4px; margin-bottom: 14px; }
.skc h4 { margin: 0; font: 700 11px/1 'Silkscreen', var(--f-ascii); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* 3D exploration */
#threeWrap { position: absolute; inset: 0; overflow: hidden; background: #b9d8f0; }
#threeWrap canvas.t3-canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; outline: none; cursor: grab; }
#threeWrap canvas.t3-canvas:active { cursor: grabbing; }
#threeWrap.t3-pick canvas.t3-canvas { cursor: pointer; }
#threeWrap:focus-visible { outline: 2px solid var(--lamp); outline-offset: -3px; }
.t3-fail { margin: 0; padding: 28px 22px; color: #1c2a3a; font-size: 14px; max-width: 46ch; }
.t3-hud { position: absolute; inset: 0; pointer-events: none; }
.t3-card { position: absolute; left: 12px; top: 12px; width: min(300px, calc(100% - 24px)); background: rgba(11, 17, 24, .74); color: #f6f0dd; border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 10px 12px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: auto; box-shadow: 0 6px 22px rgba(0, 0, 0, .28); }
.t3-card .k { font: 600 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: #ffb627; }
.t3-card .n { font: 700 17px/1.2 var(--f-display); margin: 5px 0 8px; }
.t3-exits { display: flex; flex-wrap: wrap; gap: 5px; }
.t3-exit { font: 600 11px/1 var(--f-mono); padding: 6px 8px; min-width: 36px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #fff; cursor: pointer; }
.t3-exit:hover:not([disabled]), .t3-exit:focus-visible { border-color: #ffb627; background: rgba(255, 182, 39, .24); }
.t3-exit[disabled] { opacity: .38; cursor: default; }
.t3-exit small { font-size: 9px; opacity: .8; margin-left: 4px; }
.t3-tools { position: absolute; right: 12px; top: 12px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; pointer-events: auto; max-width: calc(100% - 340px); }
.t3-tools .btn { background: rgba(11, 17, 24, .74); color: #f6f0dd; border-color: rgba(255, 255, 255, .18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
.t3-tools .btn:hover, .t3-tools .btn[aria-pressed="true"] { border-color: #ffb627; }
.t3-tools .btn[aria-pressed="true"] { background: #ffb627; color: #2c1c00; }
.t3-hint { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 10.5px/1.3 var(--f-mono); color: #f6f0dd; }
.t3-hint span { background: rgba(11, 17, 24, .6); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.t3-labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.t3-lab { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 9.5px/1 'Silkscreen', var(--f-ascii); letter-spacing: .05em; text-transform: uppercase; color: #f7f1de; background: rgba(9, 12, 18, .78); padding: 3px 6px 2px; border-radius: 3px; will-change: transform; pointer-events: none; }
.t3-lab.cur { color: #ffb627; } .t3-lab.sel { color: #fff; background: rgba(150, 90, 0, .9); }
.t3-toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); background: rgba(11, 17, 24, .82); color: #f6f0dd; font: 600 12px var(--f-mono); padding: 7px 12px; border-radius: 99px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
.t3-toast.on { opacity: 1; }
@media (max-width: 700px) { .t3-tools { position: absolute; top: auto; bottom: 40px; right: 12px; max-width: none; } .t3-card { width: min(250px, calc(100% - 24px)); } .t3-hint { display: none; } }

/* ASCII map and room scenes */
.btn[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
#asciiWrap { padding: 16px 18px 32px; width: max-content; min-width: 100%; }
#asciiHead { margin: 0 0 20px; font: 500 12.5px/normal var(--f-ascii); white-space: pre; font-variant-ligatures: none; }
#ascii { margin: 0; font: 400 12.5px/normal var(--f-ascii); white-space: pre; font-variant-ligatures: none; color: var(--ink); }
#ascii [data-id] { cursor: pointer; }
#ascii .a-sel { background: color-mix(in srgb, var(--lamp) 22%, transparent); }
.a-banner { color: var(--lamp); text-shadow: 0 0 14px color-mix(in srgb, var(--lamp) 45%, transparent); }
.a-band { color: var(--muted); }
.a-ground { color: var(--muted); opacity: .55; }
.a-rock { color: var(--grid); }
.az-above { color: var(--z-above); } .az-house { color: var(--z-house); } .az-under { color: var(--z-under); }
.az-maze { color: var(--z-maze); } .az-water { color: var(--z-water); }
.a-name { color: var(--ink); } .a-dim { color: var(--muted); }
.a-here { color: var(--lamp); font-weight: 700; text-shadow: 0 0 10px color-mix(in srgb, var(--lamp) 55%, transparent); }
.a-edge, .a-stub { color: var(--muted); } .a-dir { color: var(--muted); font-weight: 600; }
.a-treasure { color: var(--lamp); } .a-danger { color: var(--danger); } .a-puzzle { color: var(--z-maze); font-weight: 700; } .a-dark { color: var(--ink); }
.scene { margin: 12px 0 0; padding: 12px 14px; background: #0E1618; color: #C4E6CC; border-radius: 10px; font: 400 12px/normal var(--f-ascii); white-space: pre; overflow-x: auto; font-variant-ligatures: none; }
.scene .st { color: #FFB627; }
.sk { display: grid; gap: 4px; }

/* Side */
.side { display: grid; gap: 20px; }
.here { display: grid; gap: 12px; }
.here .where { font: 700 22px/1.15 var(--f-display); }
.here .where .room-link { border: 0; background: none; padding: 0; text-align: left; font: inherit; text-decoration: underline; color: inherit; text-decoration-color: var(--lamp); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
.label { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.plain li { display: flex; gap: 8px; align-items: baseline; }
ul.plain li small { color: var(--muted); }
ul.plain li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; background: var(--lamp); transform: translateY(-2px); }
ul.next li::before { background: var(--z-under); }
details { border-top: 1px solid var(--line); padding-top: 10px; }
details summary { cursor: pointer; font-weight: 600; }
details ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
.chip { display: inline-block; font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.treasure { color: var(--lamp); border-color: var(--lamp); }
.chip.danger { color: var(--danger); border-color: var(--danger); }
.chip.puzzle { color: var(--z-maze); border-color: var(--z-maze); }
.chip.tool, .chip.weapon { color: var(--z-under); border-color: var(--z-under); }
.detail h3 { font-size: 20px; }
.detail p { margin: 8px 0 0; color: var(--muted); }
.detail .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lamp); }
.panel { padding: 14px 18px 18px; max-height: 420px; overflow: auto; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.tl li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.tl .n { font: 600 12px var(--f-mono); color: var(--muted); padding-top: 2px; }
.tl .t { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--muted); }
.tl .t.discovery { background: var(--z-above); } .tl .t.danger { background: var(--danger); }
.tl .t.puzzle { background: var(--z-maze); } .tl .t.score { background: var(--lamp); }
.tl button { border: 0; background: none; padding: 0; color: var(--muted); font: 500 12px var(--f-mono); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.tl p { margin: 2px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 7px 8px 7px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; max-width: 90ch; }
footer b { color: var(--ink); font-weight: 600; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Cloud &amp; AI Summit 2026 · CAS Agent</div>
      <h1 id="title">CAS Zork Expedition</h1>
      <p id="sub"></p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="figures" id="figures" aria-label="Progress"></section>

  <div class="layout">
    <section class="card" aria-label="Map">
      <div class="toolbar">
        <h2>Map of the Great Underground Empire</h2>
        <div class="btns">
          <button class="btn" id="m-world" aria-pressed="true">World</button>
          <button class="btn" id="m-3d" aria-pressed="false">3D</button>
          <button class="btn" id="m-ascii" aria-pressed="false">ASCII</button>
          <button class="btn" id="m-chart" aria-pressed="false">Chart</button>
          <button class="btn icon" id="zout" aria-label="Zoom out">−</button>
          <button class="btn icon" id="zin" aria-label="Zoom in">+</button>
          <button class="btn" id="zfit">Fit</button>
          <button class="btn" id="zme">Find me</button>
          <label class="live" id="livewrap" hidden><input type="checkbox" id="live"> Auto-refresh</label>
        </div>
      </div>
      <div class="viewport" id="vp">
        <svg class="compass" id="compass" viewBox="-32 -32 64 64" aria-hidden="true">
