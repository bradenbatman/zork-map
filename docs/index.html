/* Layout concept: a survey chart with a literal ground line. The surface sits on top, the

:root {
  --bg: #ECEFE8; --panel: #F7F8F4; --panel-2: #E3E8DF; --ink: #141F1C; --muted: #56655F;
  --line: #C5CFC6; --grid: #C9D2C8; --lamp: #DB8A00; --lamp-soft: #FBE8BD; --lamp-ink: #3F2700;

    --line: #26363A; --grid: #1B292C; --lamp: #FFB627; --lamp-soft: #3A2A08; --lamp-ink: #FFE2A6;
    --z-above: #6FBF88; --z-house: #E29A63; --z-under: #86A6E6; --z-maze: #B394E0; --z-water: #5CC6D6;

}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }

.figures { display: flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }

.replay label { font: 500 12px var(--f-mono); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { flex: none; }

/* SVG map */
.dots { fill: var(--grid); }
.earth { fill: var(--earth); }
.ground { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .55; }
.band { font: 600 11px var(--f-mono); letter-spacing: .16em; fill: var(--muted); text-transform: uppercase; }
.edge { fill: none; stroke: var(--ink); stroke-opacity: .55; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.edge.door { stroke-dasharray: 7 5; }
.edge.locked { stroke: var(--danger); stroke-opacity: .8; stroke-dasharray: 3 6; }
.edge.assumed { stroke-opacity: .35; }
.dir { font: 600 10px var(--f-mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.stub { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 3 5; stroke-linecap: round; fill: none; }
.stubq { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
.stubt { font: 700 11px var(--f-mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.trail { fill: none; stroke: var(--lamp); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 11; opacity: .8; }
.node { cursor: pointer; }
.node rect.body { fill: color-mix(in srgb, var(--zc) 15%, var(--panel)); stroke: var(--zc); stroke-width: 2; }
.node.seen rect.body { fill: var(--panel); stroke-dasharray: 5 4; }
.node.sel rect.body { stroke-width: 3.5; }
.node text.nm { font: 600 13px/1 var(--f-body); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.node .halo { fill: none; stroke: var(--lamp); stroke-width: 3; opacity: 0; }
.node.sel .halo { opacity: .55; }
.node:hover rect.body { stroke-width: 3; }
.you .glow { fill: none; stroke: var(--lamp); stroke-width: 3.5; filter: drop-shadow(0 0 7px var(--lamp)); animation: pulse 2.4s ease-in-out infinite; }
.pin rect { fill: var(--lamp); }
.pin text { font: 700 10px var(--f-mono); letter-spacing: .1em; fill: var(--lamp-ink); text-anchor: middle; dominant-baseline: central; }
.pin path { fill: var(--lamp); }
.badge { stroke: var(--panel); stroke-width: 2; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .you .glow { animation: none; } }

/* Pixel world */
#worldWrap { position: relative; }
#worldWrap canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.wl-hot { position: absolute; inset: 0; pointer-events: none; }
.hot { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; pointer-events: auto; font: inherit; color: inherit; }
.hot .ring { position: absolute; inset: -3px; border: 2px solid transparent; border-radius: 6px; pointer-events: none; transition: border-color .12s, box-shadow .12s; }
.hot:hover .ring, .hot:focus-visible .ring { border-color: var(--lamp); box-shadow: 0 0 0 2px rgba(0,0,0,.45), 0 0 16px color-mix(in srgb, var(--lamp) 75%, transparent); }
.hot.sel .ring { border-color: #fff; box-shadow: 0 0 0 2px var(--lamp), 0 0 20px var(--lamp); }
.hot .lab { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; pointer-events: none;
  font: 700 calc(7px + var(--wz, 2) * 1.5px)/1 'Silkscreen', var(--f-ascii); letter-spacing: .05em; text-transform: uppercase;
  color: #f7f1de; background: rgba(9, 12, 18, .8); padding: 3px 5px 2px; border-radius: 3px; }
.hot.dim .lab { color: #9aa6b8; }
#worldWrap[data-lo="1"] .hot:not(.sel):not(.cur):not(:hover):not(:focus-visible) .lab { display: none; }
.hot.side .lab { left: 100%; top: 50%; transform: translate(7px, -50%); }
.hot.cur .lab { color: #ffb627; }
.hot.q { display: grid; place-items: center; font: 700 calc(7px + var(--wz, 2) * 2px)/1 'Silkscreen', var(--f-ascii); color: #ffe58a; background: rgba(9, 12, 18, .82); border: 1px solid #ffb627; border-radius: 50%; }
.hot.q:hover { background: #ffb627; color: #0d1117; }
.reg { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
  font: 700 calc(6px + var(--wz, 2) * 1.8px)/1 'Silkscreen', var(--f-ascii); letter-spacing: .22em; text-transform: uppercase; color: rgba(247, 241, 222, .6); text-shadow: 0 1px 0 rgba(0,0,0,.7), 0 0 6px rgba(0,0,0,.5); }
.portrait { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 10px; border: 1px solid var(--line); margin-top: 12px; background: #0d1117; }
.skc { display: grid; gap: 4px; margin-bottom: 14px; }
.skc h4 { margin: 0; font: 700 11px/1 'Silkscreen', var(--f-ascii); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

#threeWrap { position: absolute; inset: 0; overflow: hidden; background: #b9d8f0; }

.t3-fail { margin: 0; padding: 28px 22px; color: #1c2a3a; font-size: 14px; max-width: 46ch; }

.t3-card { position: absolute; left: 12px; top: 12px; width: min(300px, calc(100% - 24px)); background: rgba(11, 17, 24, .74); color: #f6f0dd; border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 10px 12px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: auto; box-shadow: 0 6px 22px rgba(0, 0, 0, .28); }

.t3-tools .btn:hover, .t3-tools .btn[aria-pressed="true"] { border-color: #ffb627; }
.t3-tools .btn[aria-pressed="true"] { background: #ffb627; color: #2c1c00; }
.t3-hint { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 10.5px/1.3 var(--f-mono); color: #f6f0dd; }
.t3-hint span { background: rgba(11, 17, 24, .6); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.t3-labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.t3-lab { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 9.5px/1 'Silkscreen', var(--f-ascii); letter-spacing: .05em; text-transform: uppercase; color: #f7f1de; background: rgba(9, 12, 18, .78); padding: 3px 6px 2px; border-radius: 3px; will-change: transform; pointer-events: none; }
.t3-lab.cur { color: #ffb627; } .t3-lab.sel { color: #fff; background: rgba(150, 90, 0, .9); }

@media (max-width: 700px) { .t3-tools { position: absolute; top: auto; bottom: 40px; right: 12px; max-width: none; } .t3-card { width: min(250px, calc(100% - 24px)); } .t3-hint { display: none; } }

.btn[aria-pressed="true"] { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
#asciiWrap { padding: 16px 18px 32px; width: max-content; min-width: 100%; }

.scene { margin: 12px 0 0; padding: 12px 14px; background: #0E1618; color: #C4E6CC; border-radius: 10px; font: 400 12px/normal var(--f-ascii); white-space: pre; overflow-x: auto; font-variant-ligatures: none; }
.scene .st { color: #FFB627; }

/* Side */
.side { display: grid; gap: 20px; }
.here { display: grid; gap: 12px; }
.here .where { font: 700 22px/1.15 var(--f-display); }
.here .where .room-link { border: 0; background: none; padding: 0; text-align: left; font: inherit; text-decoration: underline; color: inherit; text-decoration-color: var(--lamp); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
.label { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

<div class="wrap">
  <header class="top">
    <div>

  <section class="figures" id="figures" aria-label="Progress"></section>

      </div>

    <aside class="side">

          <button class="tab" role="tab" id="t-items" aria-selected="false" data-p="items">Items</button>
          <button class="tab" role="tab" id="t-puz" aria-selected="false" data-p="puz">Puzzles</button>
          <button class="tab" role="tab" id="t-sk" aria-selected="false" data-p="sk">Sketchbook</button>
        </div>
        <div class="panel" id="p-log" role="tabpanel"></div>
        <div class="panel" id="p-items" role="tabpanel" hidden></div>
        <div class="panel" id="p-puz" role="tabpanel" hidden></div>
        <div class="panel" id="p-sk" role="tabpanel" hidden></div>
      </section>
    </aside>
  </div>

  <footer id="about"></footer>
</div>

<script>
/* Pixel toolkit: palette, seeded noise and integer drawing primitives. Everything draws on whole pixels. */
var ZP = (function () {
  var c = {
    ink: '#0d1117', rock0: '#101620', rock1: '#161d2a', rock2: '#1e2737', rock3: '#283248',
    stone1: '#2c364e', stone2: '#3a4664', stone3: '#4c5c80', stone4: '#6a7da5', stone5: '#8ea1c7',
    bone: '#e9e2cf', paper: '#f2ead6', cream: '#f7f1de', white: '#ffffff',
    gold: '#f5c542', goldD: '#b8862a', goldL: '#ffe58a', amber: '#ffb627', orange: '#e8892b',
    red: '#c8442f', redD: '#8e2a22', redL: '#e8735a',
    brown: '#8a5a3b', brownD: '#553826', brownL: '#b4794c',
    wood: '#a87a48', woodD: '#7d5630', woodL: '#c9975c',
    sand: '#dcb984', sandD: '#a98358', sandL: '#f0d9aa',
    green: '#4a9b46', greenL: '#86c95c', greenD: '#2f6b37', greenX: '#1d452b',
    grass0: '#3d8544', grass1: '#4a9b46', grass2: '#5fae4f',
    blue: '#4d8fd6', blueD: '#2b5aa8', blueL: '#8cc4f0',
    cyan: '#6fd3e0', teal: '#2e8ca0', tealD: '#1f5f73',
    purple: '#a06bd6', purpleD: '#6a3f9e', pink: '#e08aa8',
    steel: '#a3afc2', steelD: '#5d6a84', steelL: '#d4dcea', mirror: '#c5e8f4',
    slate: '#4a5068', slateD: '#363b50', slateL: '#61698a',
    houseW: '#f0eee4', houseD: '#d5d1c2', houseX: '#a9a595'

/* Landmark sprites and per-room scenes. Every scene gets a context p:

var ZProps = (function () {
  var Z = ZP, c = Z.c, R = Z.R, P = Z.P, line = Z.line, disc = Z.disc, ell = Z.ell, dith = Z.dith, box = Z.box;
  var PR = {};

  PR.tree = function (g, x, y, s) {
    s = s == null ? 1 : s;
    var w = [9, 13, 18][s], h = [13, 19, 27][s], tr = [2, 3, 4][s], tiers = 3;
    var th = Math.round(h * 0.42), step = Math.round((h - th - tr) / (tiers - 1));
    R(g, c.brownD, x - 1, y - tr, 2, tr);
    for (var k = 0; k < tiers; k++) {

        R(g, c.green, x - half + 1, yy, Math.max(1, half * 2 - 2), 1);
        R(g, c.greenL, x - half + 1, yy, Math.max(1, Math.round(half * 0.55)), 1);
      }
      R(g, c.greenX, x - hw, base - 1, hw * 2 + 1, 1);
    }
  };
  PR.bush = function (g, x, y) {
    ell(g, c.greenX, x, y - 3, 6, 4); ell(g, c.green, x, y - 4, 5, 3); ell(g, c.greenL, x - 2, y - 5, 2, 1);
    P(g, c.red, x + 2, y - 4); P(g, c.red, x - 3, y - 3); P(g, c.redL, x + 2, y - 5);
  };
  PR.flowers = function (g, x, y, rnd) {
    var cols = [c.white, c.gold, c.pink, c.blueL];
    for (var i = 0; i < 7; i++) { var fx = x - 10 + Math.floor(rnd() * 21), fy = y - Math.floor(rnd() * 5); P(g, cols[i % 4], fx, fy); P(g, c.greenD, fx, fy + 1); }
  };
  PR.rocks = function (g, x, y) {
    ell(g, c.stone2, x, y - 2, 5, 3); ell(g, c.stone3, x - 1, y - 3, 4, 2); ell(g, c.stone4, x - 2, y - 4, 2, 1);
    ell(g, c.stone2, x + 7, y - 1, 3, 2); ell(g, c.stone3, x + 7, y - 2, 2, 1);
  };
  PR.mailbox = function (g, x, y) {
    R(g, c.brownD, x - 1, y - 8, 2, 8);
    R(g, c.ink, x - 6, y - 15, 13, 8); R(g, c.steel, x - 5, y - 14, 11, 6); R(g, c.steelL, x - 5, y - 14, 11, 1); R(g, c.steelD, x - 5, y - 9, 11, 1);
    R(g, c.ink, x + 6, y - 19, 2, 6); R(g, c.red, x + 6, y - 19, 2, 5); R(g, c.redL, x + 6, y - 19, 2, 1);
    R(g, c.ink, x - 3, y - 12, 5, 1);
  };
  PR.nest = function (g, x, y) {
    ell(g, c.brownD, x, y - 3, 7, 3); ell(g, c.brown, x, y - 4, 6, 2); ell(g, c.brownD, x, y - 4, 3, 1);
    line(g, c.brownL, x - 7, y - 4, x - 4, y - 2); line(g, c.brownL, x + 6, y - 5, x + 3, y - 2); line(g, c.sandD, x - 5, y - 6, x - 2, y - 5);
  };
  PR.bigTree = function (g, x, y) { PR.tree(g, x, y, 2); R(g, c.brown, x + 4, y - 12, 8, 2); R(g, c.brownD, x + 4, y - 10, 8, 1); PR.tree(g, x + 13, y - 1, 1); };
  PR.canopy = function (g, p) {
    var r = p.rnd;
    ell(g, c.greenX, p.x, p.y, 21, 13);
    for (var i = 0; i < 46; i++) { var a = r() * 6.283, d = Math.sqrt(r()) * 19; var lx = Math.round(p.x + Math.cos(a) * d), ly = Math.round(p.y + Math.sin(a) * d * 0.62); disc(g, r() > 0.5 ? c.greenD : c.green, lx, ly, 2 + Math.floor(r() * 2)); }

  };

    for (var i = 0; i <= w; i += 8) { R(g, c.brownD, x + i, y - 8, 2, 8); R(g, c.brownL, x + i, y - 8, 1, 8); }
    R(g, c.brownD, x, y - 7, w + 2, 2); R(g, c.brownL, x, y - 7, w + 2, 1);
  };
  PR.ledge = function (g, x, y) {
    R(g, c.stone1, x - 18, y - 2, 36, 5); R(g, c.stone3, x - 18, y - 2, 36, 1); R(g, c.stone2, x - 16, y + 1, 32, 1);

  PR.stream = function (g, x, y, w) {

  PR.trophyCase = function (g, x, y, n) {
    var egg = n > 0;

  };
  PR.rug = function (g, x, y) {
    R(g, c.redD, x - 13, y - 8, 26, 9); R(g, c.red, x - 12, y - 7, 24, 7);
    R(g, c.gold, x - 12, y - 7, 24, 1); R(g, c.gold, x - 12, y - 1, 24, 1);
    for (var i = 0; i < 6; i++) { P(g, c.goldL, x - 9 + i * 4, y - 4); P(g, c.redD, x - 7 + i * 4, y - 4); }
    R(g, c.redD, x + 8, y - 8, 5, 3); R(g, c.red, x + 9, y - 8, 4, 2);
  };
  PR.trapdoor = function (g, x, y, open) {
    R(g, c.woodD, x - 8, y - 8, 16, 9); R(g, c.woodL, x - 8, y - 8, 16, 1);
    if (open) { R(g, c.ink, x - 6, y - 7, 12, 7); for (var i = 0; i < 4; i++) R(g, i % 2 ? c.stone1 : c.stone2, x - 5, y - 6 + i * 2, 10, 1); R(g, c.woodD, x + 6, y - 9, 2, 2); }
    else { R(g, c.wood, x - 7, y - 7, 14, 7); R(g, c.steel, x - 1, y - 5, 3, 2); }
  };
  PR.boardedDoor = function (g, x, y) {
    R(g, c.ink, x - 5, y - 17, 10, 17); R(g, c.brown, x - 4, y - 16, 8, 15);
    for (var i = 0; i < 4; i++) R(g, c.brownD, x - 4 + i * 2, y - 16, 1, 15);

    P(g, c.steel, x - 3, y - 13); P(g, c.steel, x + 3, y - 13); P(g, c.steel, x - 3, y - 5); P(g, c.steel, x + 3, y - 5);

  PR.table = function (g, x, y) {
    R(g, c.woodD, x - 9, y - 7, 18, 3); R(g, c.woodL, x - 9, y - 8, 18, 1);
    R(g, c.woodD, x - 8, y - 4, 2, 4); R(g, c.woodD, x + 6, y - 4, 2, 4);
  };
  PR.stairsUp = function (g, x, y) {
    for (var i = 0; i < 6; i++) { R(g, i % 2 ? c.woodD : c.wood, x - 7 + i * 2, y - 2 - i * 2, 14 - i * 2, 2); R(g, c.woodL, x - 7 + i * 2, y - 2 - i * 2, 14 - i * 2, 1); }

    lw('background:#414f74;border:2px solid #2c364e;height:8px;margin-top:3px', 'Tunnel') +
    lw('background:#a3afc2;border:2px solid #0d1117;transform:skewY(-20deg)', 'Slide or shaft') +
    lw('background:#0d1117;border:1px solid #ffb627;border-radius:50%;width:14px', 'Unexplored exit') +
    lw('background:#ffe58a;border-radius:2px;width:10px;height:10px;box-shadow:0 0 6px #ffb627', 'Treasure sparkle') +
    lw('background:#2a2f45;border-radius:2px;width:10px', 'The thief');

  function l3(swatch, text) { return '<span><span style="display:inline-block;width:22px;height:14px;border-radius:3px;' + swatch + '"></span>' + text + '</span>'; }
  var legend3d =
    l3('background:#5fae4f;border:2px solid #2f6b37', 'Surface') +
    l3('background:#4a5a84;border:2px solid #2b3853', 'Carved room') +
    l3('background:#c79a62;border:2px solid #8a6338;height:8px;margin-top:3px', 'Path') +
    l3('background:#3a76bd;border:2px solid #2b5aa8;height:8px;margin-top:3px', 'Water') +
    l3('background:linear-gradient(90deg,#c8442f,#f5c542,#4a9b46,#4d8fd6,#a06bd6);height:8px;margin-top:3px', 'Rainbow') +
    l3('background:#ffe58a;border-radius:2px;width:10px;height:10px;box-shadow:0 0 6px #ffb627', 'Treasure') +
    l3('background:#ffb627;border-radius:50%;width:12px;height:12px;box-shadow:0 0 8px #ffb627', 'Explorer and lantern');

  /* about */
  $('#about').innerHTML = '<div><b>How this was made.</b> ' + esc(S.meta.player) + ' typed into the CAS Agent chat, which runs the original game file in a real interpreter, so every room and exit here is what the game reported. Positions on the sheet are schematic, so a line shows a connection and not a distance.</div>' +
    '<div>Only room names, item names and short notes in my own words appear on this page. The game text itself stays out of it.</div>' +
    '<div>This offline snapshot records the game as of ' + esc(upd.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '. The 3D explorer and replay only browse recorded data; they do not change the game or its save.</div>';

  /* controls */
  var vp = $('#vp');
  function centerAscii(id) {
    var el = asciiPre.querySelector('[data-id="' + id + '"]'); if (!el) return;
    var a = el.getBoundingClientRect(), b = vp.getBoundingClientRect();
    vp.scrollTo({ left: Math.max(0, vp.scrollLeft + a.left - b.left - vp.clientWidth / 2 + a.width / 2), top: Math.max(0, vp.scrollTop + a.top - b.top - vp.clientHeight / 2 + a.height / 2), behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function center(id) {
    if (mode === 'world') { world.center(id, vp); return; }
    if (mode === 'ascii') { centerAscii(id); return; }
    if (mode === '3d') { if (three) three.fly(id); return; }
    var c = ctr(id); vp.scrollTo({ left: Math.max(0, c.x * zoom - vp.clientWidth / 2), top: Math.max(0, c.y * zoom - vp.clientHeight / 2), behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function setMode(m, silent) {
    mode = m;
    ['world', '3d', 'ascii', 'chart'].forEach(function (k) { $('#m-' + k).setAttribute('aria-pressed', m === k ? 'true' : 'false'); });
    hideEl(svg, m !== 'chart'); hideEl($('#compass'), m !== 'chart'); hideEl($('#asciiWrap'), m !== 'ascii'); hideEl($('#worldWrap'), m !== 'world'); hideEl($('#threeWrap'), m !== '3d');
    $('#legend').innerHTML = m === 'world' ? legendWorld : m === '3d' ? legend3d : m === 'ascii' ? legendAscii : legendChart;
    if (m === '3d') { var t3 = ensure3d(); if (t3) t3.resume(); } else if (three) three.pause();
    if (!silent) { draw(); center(sel || S.status.location); }
  }
  $('#m-world').addEventListener('click', function () { setMode('world'); });
  $('#m-3d').addEventListener('click', function () { setMode('3d'); });
  $('#m-ascii').addEventListener('click', function () { setMode('ascii'); });
  $('#m-chart').addEventListener('click', function () { setMode('chart'); });
  asciiPre.addEventListener('click', function (ev) { var t = ev.target.closest('[data-id]'); if (t && rooms[t.dataset.id]) select(t.dataset.id, true); });
  var WSTEPS = [0.75, 1, 1.5, 2, 3];
  function setWorldZoom(z) {
    var cx = (vp.scrollLeft + vp.clientWidth / 2) / wzoom, cy = (vp.scrollTop + vp.clientHeight / 2) / wzoom;
    wzoom = z; world.setZoom(z); vp.scrollLeft = cx * z - vp.clientWidth / 2; vp.scrollTop = cy * z - vp.clientHeight / 2;
  }
  function bump(f) {
    if (mode === 'world') {
      var i = 0; WSTEPS.forEach(function (s, k) { if (Math.abs(s - wzoom) < Math.abs(WSTEPS[i] - wzoom)) i = k; });
      var j = Math.max(0, Math.min(WSTEPS.length - 1, i + (f > 1 ? 1 : -1))); setWorldZoom(WSTEPS[j]); return;
    }
    if (mode === '3d') { if (three) three.zoom(f); return; }
    if (mode === 'ascii') { az = Math.max(.5, Math.min(1.8, az * f)); draw(); } else { setZoom(zoom * f); } }
  function setZoom(z) { var cx = (vp.scrollLeft + vp.clientWidth / 2) / zoom, cy = (vp.scrollTop + vp.clientHeight / 2) / zoom; zoom = Math.max(.4, Math.min(1.8, z)); draw(); vp.scrollLeft = cx * zoom - vp.clientWidth / 2; vp.scrollTop = cy * zoom - vp.clientHeight / 2; }
  $('#zin').addEventListener('click', function () { bump(1.2); });
  $('#zout').addEventListener('click', function () { bump(1 / 1.2); });
  $('#zfit').addEventListener('click', function () {
    if (mode === '3d') { if (three) three.fit(); return; }
    if (mode === 'world') { setWorldZoom(Math.max(0.5, Math.min(2, vp.clientWidth / world.W))); }
    else if (mode === 'ascii') { az = 1; draw(); az = Math.max(.5, Math.min(1.2, (vp.clientWidth - 36) / asciiPre.scrollWidth)); draw(); }
    else { zoom = Math.max(.4, Math.min(1.4, Math.min(vp.clientWidth / W, vp.clientHeight / H))); draw(); }
    vp.scrollTo(0, 0);
  });
  $('#zme').addEventListener('click', function () { select(S.status.location, true); if (mode === '3d' && three) three.home(); else center(S.status.location); });
  var down = null;
  vp.addEventListener('pointerdown', function (ev) { if (ev.target.closest('.node') || ev.target.closest('.hot') || ev.target.closest('#threeWrap')) return; down = { x: ev.clientX, y: ev.clientY, l: vp.scrollLeft, t: vp.scrollTop }; vp.classList.add('drag'); });
  window.addEventListener('pointermove', function (ev) { if (!down) return; vp.scrollLeft = down.l - (ev.clientX - down.x); vp.scrollTop = down.t - (ev.clientY - down.y); });
  window.addEventListener('pointerup', function () { down = null; vp.classList.remove('drag'); });

  var scrub = $('#scrub'), timer = null;
  scrub.max = maxOrder; scrub.min = 1; scrub.value = maxOrder;
  function label() { $('#scrublabel').textContent = limit >= maxOrder ? 'Showing everything found' : 'Room ' + limit + ' of ' + maxOrder; }
  scrub.addEventListener('input', function () { limit = +scrub.value; label(); draw(); });
  $('#play').addEventListener('click', function () {
    if (timer) { clearInterval(timer); timer = null; $('#play').textContent = 'Replay'; return; }
    limit = 1; scrub.value = 1; label(); draw(); $('#play').textContent = 'Stop';
    timer = setInterval(function () { if (limit >= maxOrder) { clearInterval(timer); timer = null; $('#play').textContent = 'Replay'; return; } limit++; scrub.value = limit; label(); draw(); }, 700);
  });
  svg.addEventListener('click', function () { /* background click keeps the current selection */ });

  /* local-file niceties: keep the view across refreshes, and refresh by itself while the file is open from disk */
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('zork-view') || 'null'); } catch (e) { saved = null; }
  function saveView() { try { sessionStorage.setItem('zork-view', JSON.stringify({ z: zoom, wz: wzoom, az: az, mode: mode, sl: vp.scrollLeft, st: vp.scrollTop, ws: window.scrollY, sel: sel, c3: three ? three.getView() : (saved && saved.c3) || null })); } catch (e) { /* storage blocked */ } }
  window.addEventListener('pagehide', saveView);
  zoom = saved && saved.z ? saved.z : Math.max(.85, Math.min(1, vp.clientWidth / W));
  az = saved && saved.az ? saved.az : 1;
  banner();
  world = ZorkWorld.create({ S: S, host: $('#worldWrap'), layout: S.layout || {}, onSelect: function (id) { select(id, true); } });
  wzoom = saved && saved.wz ? saved.wz : (vp.clientWidth >= 600 ? 2 : 1); world.setZoom(wzoom);
  setMode(saved && ['world', '3d', 'ascii', 'chart'].indexOf(saved.mode) >= 0 ? saved.mode : 'world', true);
  label(); select(saved && saved.sel && rooms[saved.sel] ? saved.sel : S.status.location, false); draw();
  if (saved && saved.c3 && three) three.setView(saved.c3);
  if (saved) { vp.scrollLeft = saved.sl || 0; vp.scrollTop = saved.st || 0; window.scrollTo(0, saved.ws || 0); } else { center(S.status.location); }

  var live = $('#live'), lastAct = Date.now(), isFile = location.protocol === 'file:';
  $('#livewrap').hidden = !isFile;
  try { live.checked = sessionStorage.getItem('zork-live') === 'on'; } catch (e) { live.checked = false; }
  live.addEventListener('change', function () { try { sessionStorage.setItem('zork-live', live.checked ? 'on' : 'off'); } catch (e) { /* storage blocked */ } });
  ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(function (t) { window.addEventListener(t, function () { lastAct = Date.now(); }, { passive: true }); });
  if (isFile) setInterval(function () { if (!live.checked || document.hidden || Date.now() - lastAct < 20000) return; if (mode === '3d' && three) return; saveView(); location.reload(); }, 15000);
})();
</script>
